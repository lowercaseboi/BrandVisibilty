<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Apply the saved theme and language before React loads, so there is no flash.
      // Keys and values must match src/settings/theme.tsx and src/i18n/index.tsx.
      (function () {
        var root = document.documentElement;
        var pref = null;
        var lang = null;
        try {
          pref = localStorage.getItem("bv.theme");
          lang = localStorage.getItem("bv.lang");
        } catch (e) {}
        var dark = pref !== "light";
        if (pref === "system") {
          try {
            dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          } catch (e) {}
        }
        root.setAttribute("data-theme", dark ? "dark" : "light");
        if (lang === "hi" || lang === "mr") root.setAttribute("lang", lang);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300..700&family=Space+Grotesk:wght@500..700&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>BrandVisibility</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
