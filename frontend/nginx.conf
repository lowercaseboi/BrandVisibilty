server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # /api/brands -> http://backend:8000/brands
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    # Client-side routes (react-router) fall back to the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
