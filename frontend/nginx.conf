server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # VariantPatch/DeliverablePatch bodies top out around ~300KB of JSON; no file uploads
    # exist in the API. Modest headroom over the nginx default (1m already covers this).
    client_max_body_size 5m;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # /api/brands -> http://backend:8000/brands. This one rule also covers
    # /api/media/<campaign_id>/<file> -> http://backend:8000/media/<campaign_id>/<file>
    # (generated campaign images) and /api/brands/<key>/campaigns/<id>/export.zip, whose
    # zip build (image generation + packing) can be the slowest call in the app.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
    }

    # Vite's fingerprinted build output (content-hashed filenames) never changes under a
    # given URL, so it's safe to cache for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        try_files $uri =404;
    }

    # The shell must always be revalidated, or a browser could keep serving an old
    # index.html that points at /assets/* files a new deploy has already removed.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        try_files $uri =404;
    }

    # Client-side routes (react-router) fall back to the SPA shell.
    location / {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        try_files $uri $uri/ /index.html;
    }
}
